<!DOCTYPE html>
<html>
<head>
    <title>Message Status Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        #messages { border: 1px solid #ccc; height: 400px; overflow-y: auto; padding: 10px; margin: 10px 0; }
        .message { margin: 5px 0; padding: 5px; border-left: 3px solid #667eea; }
        .message-sender { font-weight: bold; }
        .message-time { font-size: 0.8em; color: #666; }
        .status-icon { margin-left: 5px; }
        .status-sent { color: #999; }
        .status-delivered { color: #666; }
        .status-seen { color: #667eea; }
        input[type="text"] { width: 70%; padding: 5px; }
        button { padding: 5px 10px; }
    </style>
</head>
<body>
    <h2>Message Status Test</h2>
    
    <div>
        <label>Username: <input type="text" id="username" value="TestUser1" /></label>
        <button onclick="connect()">Connect</button>
        <button onclick="disconnect()">Disconnect</button>
    </div>
    
    <div id="messages"></div>
    
    <div>
        <input type="text" id="messageInput" placeholder="Type a message..." />
        <button onclick="sendMessage()">Send</button>
    </div>
    
    <div>
        <p><strong>Status Indicators:</strong></p>
        <p>✓ (gray) - Sent | ✓✓ (gray) - Delivered | ✓✓ (blue) - Seen</p>
        <p><strong>Console Log:</strong> Press F12 to see detailed logs</p>
    </div>

    <script>
        let ws = null;
        let username = '';
        let connected = false;

        function connect() {
            username = document.getElementById('username').value || 'TestUser1';
            console.log('Connecting as:', username);
            
            ws = new WebSocket('ws://localhost:8889');
            
            ws.onopen = () => {
                console.log('Connected to WebSocket');
                connected = true;
                
                // Send connect message
                ws.send(JSON.stringify({type: 'CONNECT', sender: username}));
                addSystemMessage('Connected as ' + username);
            };
            
            ws.onmessage = (event) => {
                console.log('Raw message received:', event.data);
                try {
                    const message = JSON.parse(event.data);
                    console.log('Parsed message:', message);
                    handleMessage(message);
                } catch (e) {
                    console.error('Failed to parse message:', e, event.data);
                }
            };
            
            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
                addSystemMessage('Connection error');
            };
            
            ws.onclose = () => {
                console.log('WebSocket closed');
                connected = false;
                addSystemMessage('Disconnected');
            };
        }

        function disconnect() {
            if (ws) {
                ws.close();
            }
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            if (!message || !connected) return;
            
            console.log('Sending message:', message);
            ws.send(JSON.stringify({
                type: 'CHAT',
                sender: username,
                content: message
            }));
            
            input.value = '';
        }

        function handleMessage(message) {
            switch (message.type) {
                case 'CHAT':
                    console.log('Handling CHAT message:', message);
                    addChatMessage(message.sender, message.content, message.messageId, message.status);
                    break;
                case 'SYSTEM':
                    addSystemMessage(message.content);
                    break;
                case 'MESSAGE_SEEN':
                    console.log('Message status update:', message);
                    try {
                        const statusData = JSON.parse(message.content);
                        updateMessageStatus(statusData.messageId, statusData.status);
                    } catch (e) {
                        console.error('Failed to parse status update:', e);
                    }
                    break;
                default:
                    console.log('Unknown message type:', message.type);
            }
        }

        function addChatMessage(sender, content, messageId, status) {
            console.log('Adding chat message - Sender:', sender, 'MessageId:', messageId, 'Status:', status, 'Current user:', username);
            
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message';
            
            const senderDiv = document.createElement('div');
            senderDiv.className = 'message-sender';
            senderDiv.textContent = sender;
            
            const timeDiv = document.createElement('span');
            timeDiv.className = 'message-time';
            timeDiv.textContent = ' (' + new Date().toLocaleTimeString() + ')';
            
            // Add status indicator for own messages
            if (sender === username && messageId) {
                console.log('Adding status indicator for own message');
                const statusSpan = document.createElement('span');
                statusSpan.className = 'message-status';
                statusSpan.setAttribute('data-message-id', messageId);
                updateStatusIcon(statusSpan, status || 'SENT');
                timeDiv.appendChild(statusSpan);
            }
            
            senderDiv.appendChild(timeDiv);
            messageDiv.appendChild(senderDiv);
            
            const contentDiv = document.createElement('div');
            contentDiv.textContent = content;
            messageDiv.appendChild(contentDiv);
            
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function addSystemMessage(content) {
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.style.fontStyle = 'italic';
            messageDiv.style.color = '#666';
            messageDiv.textContent = content;
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function updateStatusIcon(statusElement, status) {
            console.log('Updating status icon to:', status);
            statusElement.innerHTML = '';
            
            switch (status) {
                case 'SENT':
                    statusElement.innerHTML = ' <span class="status-icon status-sent">✓</span>';
                    statusElement.title = 'Sent';
                    break;
                case 'DELIVERED':
                    statusElement.innerHTML = ' <span class="status-icon status-delivered">✓✓</span>';
                    statusElement.title = 'Delivered';
                    break;
                case 'SEEN':
                    statusElement.innerHTML = ' <span class="status-icon status-seen">✓✓</span>';
                    statusElement.title = 'Seen';
                    break;
                default:
                    console.log('Unknown status:', status);
            }
        }

        function updateMessageStatus(messageId, status) {
            console.log('Updating message status:', messageId, 'to', status);
            const statusElement = document.querySelector(`[data-message-id="${messageId}"]`);
            if (statusElement) {
                updateStatusIcon(statusElement, status);
                console.log('Status updated successfully');
            } else {
                console.error('Status element not found for messageId:', messageId);
            }
        }

        // Allow Enter key to send message
        document.getElementById('messageInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        console.log('Test page loaded. Make sure both servers are running on ports 8888 and 8889.');
    </script>
</body>
</html>
